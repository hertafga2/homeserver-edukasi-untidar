server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;

    # Log akses dimatikan di ketiga perangkat agar penulisan log tidak ikut membebani uji.
    access_log off;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
