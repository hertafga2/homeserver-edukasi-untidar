# Paket aplikasi uji - Penelitian Home Server Edukasi (UNTIDAR 2026)
# Dipakai SAMA PERSIS di mini PC Ryzen, Intel, dan ARM.
#   Halaman statis : http://IP:8080/
#   Halaman dinamis: http://IP:8080/uji.php   (membaca 1.000 baris dari MariaDB)
# Port 8080 dipakai agar tidak bentrok dengan dasbor CasaOS di port 80.
name: ujihomeserver

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: gantiRootIni
    volumes:
      - ./db/buat_db.sql:/docker-entrypoint-initdb.d/01_buat_db.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  php:
    build:
      context: ./php
      network: host
    image: ujihomeserver-php:8.3
    restart: unless-stopped
    volumes:
      - ./html:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  dbdata:
